<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spell Correcter</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-card">
      <div class="logo-wrap" role="img" aria-label="Prohibition sign">
        <div class="logo-mark">
          <svg class="no-symbol" viewBox="0 0 72 72" aria-hidden="true">
            <circle cx="36" cy="36" r="29" />
            <path d="M15.5 56.5 56.5 15.5" />
          </svg>
        </div>
      </div>

      <h1>Spell Correcter</h1>
      <p class="subtitle">Auto-fix common spelling mistakes while typing.</p>

      <div class="actions">
        <button id="toggle" class="primary">Disable</button>
        <button id="fix-page" class="secondary" type="button">Fix This Page</button>
      </div>

      <p id="status" class="status">Ready</p>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
