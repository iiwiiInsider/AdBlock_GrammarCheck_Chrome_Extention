<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spell Correcter</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-card">
      <div class="logo-wrap" aria-label="Spell Correcter logo">
        <div class="logo-mark">
          <span class="check">✓</span>
          <span class="spark">✦</span>
        </div>
      </div>

      <h1>Spell Correcter</h1>
      <p class="subtitle">Auto-fix common spelling mistakes while typing.</p>

      <div class="actions">
        <button id="toggle" class="primary">Disable</button>
      </div>

      <p id="status" class="status">Ready</p>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
